name: Update News and Products

on:
  schedule:
    # 4時間ごとに実行 (UTC時間)
    - cron: '0 */4 * * *'
  workflow_dispatch: # 手動実行用

jobs:
  update-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの書き込み権限を付与

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest news & products
        run: npm run update-news

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Latest news fetched" && git push)
